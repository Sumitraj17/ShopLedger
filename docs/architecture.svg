<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI calls server.js and API routers. Routers use library modules and the JSON datastore. The numbered blue arrows show an order placement flow. Invoice and tax modules are highlighted for the ticket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536476"/></marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087ea4"/></marker>
    <style>
      .bg { fill:#f8fafc; }
      .zone { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .module { fill:#ffffff; stroke:#64748b; stroke-width:1.4; }
      .route { fill:#eef6ff; stroke:#3b82f6; stroke-width:1.4; }
      .ticket { fill:#f5edff; stroke:#8b5cf6; stroke-width:2; }
      .data { fill:#f0fdf4; stroke:#22c55e; stroke-width:1.8; }
      .title { font:700 22px Arial, sans-serif; fill:#0f172a; }
      .zoneTitle { font:700 15px Arial, sans-serif; fill:#334155; }
      .name { font:700 13px Arial, sans-serif; fill:#172554; }
      .label { font:12px Arial, sans-serif; fill:#334155; }
      .small { font:12px Arial, sans-serif; fill:#475569; }
      .note { font:12px Arial, sans-serif; fill:#075985; }
      .edge { fill:none; stroke:#94a3b8; stroke-width:1.4; marker-end:url(#arrow); }
      .flow { fill:none; stroke:#087ea4; stroke-width:2.6; marker-end:url(#flowArrow); }
      .number { fill:#087ea4; }
      .numberText { font:700 12px Arial, sans-serif; fill:#ffffff; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <text x="36" y="35" class="title">ShopLedger — architecture and order placement</text>
  <text x="36" y="56" class="small">Solid blue arrows show the numbered POST /api/orders path; grey arrows show module dependencies.</text>

  <!-- top-level application surfaces -->
  <rect class="zone" x="30" y="82" width="230" height="150" rx="10"/>
  <text x="46" y="108" class="zoneTitle">Browser / static UI</text>
  <rect class="module" x="46" y="122" width="198" height="88" rx="7"/>
  <text x="58" y="147" class="name">public/</text>
  <text x="58" y="169" class="label">index.html · js/app.js</text>
  <text x="58" y="188" class="label">css/style.css</text>

  <rect class="zone" x="300" y="82" width="255" height="150" rx="10"/>
  <text x="316" y="108" class="zoneTitle">Express application</text>
  <rect class="module" x="316" y="122" width="223" height="88" rx="7"/>
  <text x="329" y="147" class="name">server.js</text>
  <text x="329" y="169" class="label">JSON middleware · static public/</text>
  <text x="329" y="188" class="label">/api mounts · /orders/:id/invoice</text>

  <rect class="zone" x="595" y="82" width="570" height="150" rx="10"/>
  <text x="611" y="108" class="zoneTitle">routes/ — mounted below /api</text>
  <rect class="route" x="611" y="122" width="124" height="88" rx="7"/>
  <text x="622" y="145" class="name">products.js</text>
  <text x="622" y="167" class="label">GET /products</text><text x="622" y="186" class="label">GET /coupons</text>
  <rect class="route" x="746" y="122" width="124" height="88" rx="7"/>
  <text x="757" y="145" class="name">orders.js</text>
  <text x="757" y="167" class="label">GET /orders</text><text x="757" y="186" class="label">POST /orders</text>
  <rect class="route" x="881" y="122" width="124" height="88" rx="7"/>
  <text x="892" y="145" class="name">customers.js</text>
  <text x="892" y="167" class="label">GET /customers</text><text x="892" y="186" class="label">POST /:id/settle</text>
  <rect class="route" x="1016" y="122" width="133" height="88" rx="7"/>
  <text x="1027" y="145" class="name">reports.js</text>
  <text x="1027" y="167" class="label">dashboard · GST recon</text><text x="1027" y="186" class="label">pricing preview · export</text>

  <!-- dependency arrows -->
  <path class="edge" d="M260 166 H300"/>
  <path class="edge" d="M555 166 H595"/>
  <path class="edge" d="M427 210 V270 H112"/>
  <path class="edge" d="M427 210 V270 H920"/>

  <!-- libraries -->
  <rect class="zone" x="30" y="260" width="1135" height="356" rx="10"/>
  <text x="46" y="287" class="zoneTitle">lib/ — business logic</text>

  <rect class="module" x="48" y="306" width="170" height="70" rx="7"/>
  <text x="60" y="330" class="name">store.js</text>
  <text x="60" y="351" class="label">read · write · appendAudit</text>

  <rect class="module" x="236" y="306" width="170" height="70" rx="7"/>
  <text x="248" y="330" class="name">orders.js</text>
  <text x="248" y="351" class="label">add · get · cancel · list</text>

  <rect class="module" x="424" y="306" width="170" height="70" rx="7"/>
  <text x="436" y="330" class="name">inventory.js</text>
  <text x="436" y="351" class="label">find · check · reserve · release</text>

  <rect class="module" x="612" y="306" width="170" height="70" rx="7"/>
  <text x="624" y="330" class="name">pricing.js</text>
  <text x="624" y="351" class="label">subtotal · discount · computeTotals</text>

  <rect class="ticket" x="800" y="306" width="170" height="70" rx="7"/>
  <text x="812" y="330" class="name">tax.js</text>
  <text x="812" y="351" class="label">getRateForItem · splitCgstSgst</text>

  <rect class="module" x="988" y="306" width="160" height="70" rx="7"/>
  <text x="1000" y="330" class="name">coupons.js</text>
  <text x="1000" y="351" class="label">validate · calculateDiscount</text>

  <rect class="module" x="48" y="404" width="170" height="70" rx="7"/>
  <text x="60" y="428" class="name">ledger.js</text>
  <text x="60" y="449" class="label">chargeOrderToKhata</text>

  <rect class="module" x="236" y="404" width="170" height="70" rx="7"/>
  <text x="248" y="428" class="name">reports.js</text>
  <text x="248" y="449" class="label">dashboard · GST reconciliation</text>

  <rect class="ticket" x="424" y="404" width="170" height="70" rx="7"/>
  <text x="436" y="428" class="name">invoice.js</text>
  <text x="436" y="449" class="label">computeInvoiceFigures · render</text>

  <rect class="module" x="612" y="404" width="170" height="70" rx="7"/>
  <text x="624" y="428" class="name">dates.js</text>
  <text x="624" y="449" class="label">today · normalizeDateKey</text>

  <rect class="module" x="800" y="404" width="170" height="70" rx="7"/>
  <text x="812" y="428" class="name">config.js</text>
  <text x="812" y="449" class="label">shop · tax slabs · coupons</text>

  <text x="48" y="516" class="note">Order route uses store, inventory, coupons, pricing, ledger and orders. Pricing uses tax and coupons.</text>
  <text x="48" y="539" class="note">Invoice renderer uses config; reports use invoice for reconciliation. Tax is highlighted because checkout calls it directly.</text>
  <path class="edge" d="M697 376 V392 H885 V376"/>
  <path class="edge" d="M697 376 V392 H1068 V376"/>
  <path class="edge" d="M885 376 V394 H885"/>
  <path class="edge" d="M321 404 V388 H133 V376"/>
  <path class="edge" d="M509 404 V390 H885 V474"/>

  <!-- data -->
  <rect class="data" x="48" y="648" width="350" height="104" rx="9"/>
  <text x="64" y="677" class="name">data/db.json</text>
  <text x="64" y="700" class="label">products · customers · orders · settlements</text>
  <text x="64" y="720" class="label">auditLog · nextOrderId · nextSettlementId</text>
  <path class="edge" d="M133 376 V648"/>

  <!-- explicit numbered flow -->
  <rect class="zone" x="430" y="648" width="735" height="104" rx="9"/>
  <text x="446" y="674" class="zoneTitle">Numbered flow: placing an order</text>
  <text x="446" y="701" class="label">1 UI POST /api/orders</text><text x="621" y="701" class="label">2 server.js → orders router</text><text x="852" y="701" class="label">3 validate products + stock</text>
  <text x="446" y="728" class="label">4 price / coupon / HSN GST</text><text x="674" y="728" class="label">5 Khata + reserve inventory</text><text x="916" y="728" class="label">6 append order, audit, write JSON</text>
  <path class="flow" d="M145 210 V244 H808 V210"/>
  <circle class="number" cx="285" cy="244" r="11"/><text class="numberText" x="285" y="244">1</text>
  <circle class="number" cx="578" cy="244" r="11"/><text class="numberText" x="578" y="244">2</text>
  <path class="flow" d="M808 210 V294 H509"/>
  <circle class="number" cx="550" cy="294" r="11"/><text class="numberText" x="550" y="294">3</text>
  <path class="flow" d="M808 294 H697"/>
  <circle class="number" cx="748" cy="294" r="11"/><text class="numberText" x="748" y="294">4</text>
  <path class="flow" d="M509 376 V404 H133"/>
  <circle class="number" cx="321" cy="404" r="11"/><text class="numberText" x="321" y="404">5</text>
  <path class="flow" d="M133 474 V632"/>
  <circle class="number" cx="133" cy="561" r="11"/><text class="numberText" x="133" y="561">6</text>

  <!-- legend -->
  <rect x="972" y="24" width="14" height="14" class="module" rx="2"/><text x="993" y="36" class="small">module/router dependency</text>
  <rect x="972" y="46" width="14" height="14" class="ticket" rx="2"/><text x="993" y="58" class="small">ticket focus: invoice.js, tax.js</text>
</svg>
